<!DOCTYPE html>
<html lang="ja">
<head><meta charset="utf-8"><title>selftest</title>
<style>body{font-family:monospace;padding:12px}#stage{position:absolute;left:-9999px;top:0}</style>
</head>
<body>
<!--
  動作確認用ページ。ブラウザで開くと結果が表示される。
  ヘッドレスでも確認できる:
    chrome --headless --virtual-time-budget=6000 --dump-dom \
      "http://localhost:8777/tools/selftest.html" | grep RESULT
-->
<div id="stage"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
<pre id="out">running...</pre>

<script type="module">
import { PRESETS, defaultDoc, defaultAxis, setTick } from '../js/model.js';
import { render } from '../js/render.js';
import { toPNGBlob, toSVGString, mmToPx } from '../js/export.js';

const log = [];
const ok = (c, m) => log.push(`${c ? 'PASS' : 'FAIL'}  ${m}`);

function imgFromBlob(b) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(b);
    const i = new Image();
    i.onload = () => { URL.revokeObjectURL(u); res(i); };
    i.onerror = rej; i.src = u;
  });
}

(async () => {
  const svg = document.getElementById('svg');

  // --- 1. 比例数直線が描けるか ---
  const doc = PRESETS.ratio2.make();
  const vb = render(doc, svg, { interactive: false });
  ok(vb.w > 50 && vb.h > 10, `比例数直線の寸法 ${vb.w.toFixed(1)}x${vb.h.toFixed(1)}mm`);
  ok(svg.querySelectorAll('text').length >= 8, `文字要素 ${svg.querySelectorAll('text').length}個（分数・ルビ・単位を含む）`);
  ok(svg.querySelectorAll('line[stroke-dasharray]').length >= 2, '縦の破線が引かれている');

  // --- 2. 透過PNGが書き出せるか ---
  const blob = await toPNGBlob(svg, 300);
  ok(blob && blob.size > 1000, `PNG生成 ${blob ? (blob.size / 1024).toFixed(1) : 0}KB`);
  const img = await imgFromBlob(blob);
  ok(img.width === mmToPx(vb.w, 300), `PNG幅 ${img.width}px（期待 ${mmToPx(vb.w, 300)}px）`);

  // --- 3. 背景が本当に透過しているか（四隅のアルファが0） ---
  const c = document.createElement('canvas');
  c.width = img.width; c.height = img.height;
  const cx = c.getContext('2d');
  cx.drawImage(img, 0, 0);
  const corners = [[0, 0], [c.width - 1, 0], [0, c.height - 1], [c.width - 1, c.height - 1]];
  const alphas = corners.map(([x, y]) => cx.getImageData(x, y, 1, 1).data[3]);
  ok(alphas.every((a) => a === 0), `四隅のアルファ = ${alphas.join(',')}（0なら透過）`);

  // --- 4. 中身がちゃんと描かれているか（黒い画素が存在する） ---
  const all = cx.getImageData(0, 0, c.width, c.height).data;
  let inkPx = 0;
  for (let i = 3; i < all.length; i += 4) if (all[i] > 128) inkPx++;
  ok(inkPx > 500, `不透明な画素 ${inkPx}個（線と文字が描かれている）`);

  // --- 5. 文字がフォールバックせず描けているか（文字の幅を測る） ---
  const t = svg.querySelector('text');
  ok(t && t.getComputedTextLength() > 0, `文字の実測幅 ${t ? t.getComputedTextLength().toFixed(2) : 0}mm`);

  // --- 6. SVG書き出し ---
  const s = toSVGString(svg);
  ok(s.includes('<svg') && s.includes('</svg>') && !s.includes('tick-hit'), `SVG文字列 ${s.length}文字・当たり判定を含まない`);

  // --- 7. 目盛りの多い数直線（大きい数③） ---
  const d2 = PRESETS.oku3.make();
  const vb2 = render(d2, svg, { interactive: false });
  ok(svg.querySelectorAll('line').length > 40, `6000万〜1億の目盛り線 ${svg.querySelectorAll('line').length}本`);
  ok(svg.querySelectorAll('polygon').length === 3, `引き出し矢印 ${svg.querySelectorAll('polygon').length}本（□↓が3つ）`);
  ok(svg.querySelectorAll('rect[fill=none]').length === 3, '□が3つ（右端が1億＝100000000を問う）');
  ok(vb2.w > 130, `幅 ${vb2.w.toFixed(1)}mm`);

  // --- 7b. 記号と矢印（数字は線の上・記号は線の下） ---
  const d4 = PRESETS.mark.make();
  render(d4, svg, { interactive: false });
  const tx = [...svg.querySelectorAll('text')].map((t) => t.textContent);
  ok(['ア', 'イ', 'ウ'].every((c) => tx.includes(c)), `記号 ア・イ・ウ が出ている`);
  ok(svg.querySelectorAll('polygon').length === 3, `記号の矢印 ${svg.querySelectorAll('polygon').length}本`);
  {
    // 記号(ア)が線より下・数字(0)が線より上にあること
    // 画面上の実際の位置で比べる（<g transform> の中にあるので y 属性では比べられない）
    const ys = [...svg.querySelectorAll('text')];
    const mark = ys.find((t) => t.textContent === 'ア');
    const num = ys.find((t) => t.textContent === '10000');
    const my = mark && mark.getBoundingClientRect().top;
    const ny = num && num.getBoundingClientRect().top;
    ok(mark && num && my > ny, `記号は線の下・数字は線の上（記号y=${(my||0).toFixed(0)} > 数字y=${(ny||0).toFixed(0)}）`);
  }

  // --- 7c. ラベルなしでも矢印だけ描ける（矢印が出ない不具合の再発防止） ---
  const d5 = defaultDoc({ axes: [defaultAxis({ tickCount: 10, tickStep: 10, labelEvery: 10 })] });
  setTick(d5.axes[0], 3, { lift: 6, pointer: true });   // mode は 'auto' のまま＝数字が出ない目盛り
  render(d5, svg, { interactive: false });
  ok(svg.querySelectorAll('polygon').length === 1, '数字の出ない目盛りでも矢印だけ描ける');

  // --- 8. □（穴埋め）と帯分数 ---
  const d3 = defaultDoc({ axes: [defaultAxis({ tickCount: 4, tickStep: 20, labelEvery: 0 })] });
  setTick(d3.axes[0], 1, { mode: 'box' });
  setTick(d3.axes[0], 2, { mode: 'fraction', whole: '1', num: '2', den: '3' });
  setTick(d3.axes[0], 3, { mode: 'text', text: 'ア', ruby: 'あ' });
  render(d3, svg, { interactive: false });
  ok(svg.querySelectorAll('rect[fill=none], rect[fill="none"]').length === 1, '□が1つ描かれている（塗りなし＝透過）');

  // --- 9. サムネイルの容量（localStorage 5MB を圧迫しないか） ---
  const { toThumbnail } = await import('../js/export.js');
  render(doc, svg, { interactive: false });
  const th = await toThumbnail(svg, 200);
  const thKB = (th.length * 2) / 1024;   // UTF-16で保存されるので ×2
  ok(thKB < 12, `サムネイル1件 ${thKB.toFixed(1)}KB（12KB未満なら400件でも5MBに収まる）`);

  // --- 10. 教科書どおりの数を入れたとき（2026-10-02: 本人が作れなかった原因の再発防止） ---
  const { fmtKanji, normalizeDoc } = await import('../js/model.js');
  ok(fmtKanji(1000000) === '100万' && fmtKanji(90000000) === '9000万' && fmtKanji(100000000) === '1億',
    `万・億の表記: ${fmtKanji(1000000)} / ${fmtKanji(90000000)} / ${fmtKanji(100000000)}`);

  const labelsOf = () => [...svg.querySelectorAll('.art text')];
  const overlaps = () => {
    // 数字どうし・数字と□が画面上で重なっていないか（同じ高さの段にあるものだけ比べる）
    const rs = [...svg.querySelectorAll('.art text, .art rect')].map((e) => e.getBoundingClientRect())
      .filter((r) => r.width > 0);
    let n = 0;
    for (let i = 0; i < rs.length; i++) for (let j = i + 1; j < rs.length; j++) {
      const a = rs[i], b = rs[j];
      if (a.left < b.right - 0.5 && b.left < a.right - 0.5 && a.top < b.bottom - 0.5 && b.top < a.bottom - 0.5) n++;
    }
    return n;
  };

  // 0〜1000000 を 10目盛り・おまかせ → 数字が重ならない
  const e1 = defaultDoc({ axes: [defaultAxis({ tickCount: 10, start: 0, valueStep: 100000 })] });
  render(e1, svg, { interactive: false });
  ok(overlaps() === 0, `0〜100万（おまかせ）: 数字の重なり ${overlaps()}か所 / ${labelsOf().map((t) => t.textContent).join(' ')}`);

  // □を置いたら、隣の数字は □ に重ならない
  setTick(e1.axes[0], 3, { mode: 'box' });
  setTick(e1.axes[0], 8, { mode: 'box' });
  render(e1, svg, { interactive: false });
  ok(overlaps() === 0, `□を30万・80万に置く: 重なり ${overlaps()}か所 / ${labelsOf().map((t) => t.textContent).join(' ')}`);

  // 9000万〜1億・両はしだけ → 「9000万」と「1億」だけが出る
  const e2 = defaultDoc({ axes: [defaultAxis({ tickCount: 10, start: 90000000, valueStep: 1000000, labelEvery: 'ends' })] });
  render(e2, svg, { interactive: false });
  ok(labelsOf().map((t) => t.textContent).join('|') === '9000万|1億', `両はしだけ: ${labelsOf().map((t) => t.textContent).join(' / ')}`);

  // 目盛りが細かくても数字が重ならない（8桁の数・3mm間隔）
  const e3 = defaultDoc({ axes: [defaultAxis({ tickCount: 40, tickStep: 3, start: 60000000, valueStep: 1000000 })] });
  render(e3, svg, { interactive: false });
  ok(overlaps() === 0 && labelsOf().length >= 3, `細かい目盛り（おまかせ）: 重なり ${overlaps()}か所・数字 ${labelsOf().length}個`);

  // 以前の版で保存した作品（9000 と打って 万 を付けた方式）が崩れない
  const oldDoc = { schema: 1, axes: [{ tickCount: 10, tickStep: 14, start: 9000, valueStep: 100, labelEvery: 10, labelSuffix: '万', suffixSkipZero: false, ticks: {} }] };
  render(normalizeDoc(oldDoc), svg, { interactive: false });
  ok(labelsOf().map((t) => t.textContent).join('|') === '9000万|10000万', `古い作品の読み込み: ${labelsOf().map((t) => t.textContent).join(' / ')}`);

  // --- 11. 分数の書き方・□が隣に当たるとき（2026-10-02 追加） ---
  const f1 = defaultDoc({ axes: [defaultAxis({ tickCount: 10, start: 0, valueStep: 0.2, notation: 'mixed', labelEvery: 1 })] });
  render(f1, svg, { interactive: false });
  const bars = svg.querySelectorAll('.art g line').length;
  ok(bars === 8 && overlaps() === 0, `分数 0〜2（1/5ずつ・帯分数）: 分数 ${bars}個・重なり ${overlaps()}か所`);

  const f2 = defaultDoc({ axes: [defaultAxis({ tickCount: 3, start: 0, valueStep: 1 / 3, notation: 'improper' })] });
  render(f2, svg, { interactive: false });
  ok(svg.querySelectorAll('.art g line').length === 2, '0〜1 を3等分 → 1/3・2/3 が分数で出る');

  // □が1目盛りの幅より広いとき、隣の数字を消さずに□を縮めて収める
  const g1 = defaultDoc({ axes: [defaultAxis({ tickCount: 4, start: 0, valueStep: 200, labelEvery: 1 })] });
  setTick(g1.axes[0], 3, { mode: 'box' });
  render(g1, svg, { interactive: false });
  const bw = Number(svg.querySelector('.art rect').getAttribute('width'));
  ok(overlaps() === 0 && labelsOf().length === 4 && bw < 14 && bw > 9,
    `広い□は縮めて収める: □の幅 ${bw.toFixed(1)}mm・数字 ${labelsOf().map((t) => t.textContent).join(' ')}・重なり ${overlaps()}`);

  // となり合う目盛りを2つとも□にしても、□どうしが重ならない
  const g2 = defaultDoc({ axes: [defaultAxis({ tickCount: 10, labelEvery: 1 })] });
  setTick(g2.axes[0], 4, { mode: 'box' });
  setTick(g2.axes[0], 5, { mode: 'box' });
  render(g2, svg, { interactive: false });
  ok(overlaps() === 0, `となり合う□: 重なり ${overlaps()}か所`);

  // --- 目視用: 書き出したPNGを色付き背景の上に並べる（透過と字形の確認） ---
  const box = document.createElement('div');
  box.style.cssText = 'margin-top:14px;padding:14px;background:#ffd9e8;display:inline-block;border-radius:8px';
  const shown = await imgFromBlob(blob);
  shown.style.width = '460px';
  box.appendChild(shown);
  document.body.appendChild(box);

  const fails = log.filter((l) => l.startsWith('FAIL')).length;
  document.getElementById('out').textContent =
    log.join('\n') + `\n\nRESULT ${fails === 0 ? 'ALL-PASS' : fails + '-FAILED'} (${log.length} checks)`;
})().catch((e) => {
  document.getElementById('out').textContent = 'RESULT ERROR ' + e.message + '\n' + e.stack;
});
</script>
</body>
</html>
